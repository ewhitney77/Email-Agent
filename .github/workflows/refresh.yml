name: Refresh job matches

# Scrapes target career pages, scores roles against the ideal-role profiles,
# and commits data/results.json. The commit triggers a Vercel redeploy.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-job-matches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build results snapshot
        env:
          # Override any of these via repository Variables/Secrets if desired.
          MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '0.75' }}
          EMBEDDING_BACKEND: sentence-transformers
        run: python -m jobmonitor.export

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --staged --quiet; then
            echo "No changes to results.json"
          else
            git commit -m "chore: refresh job match results [skip ci]"
            git push
          fi
