# ── Target profile ─────────────────────────────────────────────────────────
target_roles:
  - Applied AI Product Manager
  - Data Platform Product Manager
  - Data Platform PM
  - GTM Product Manager
  - Senior Product Manager AI
  - Senior Product Manager Data
  - Sr. Product Manager AI
  - Sr. Product Manager Data
  - Product Manager AI
  - Product Manager Data Platform
  - Head of Product AI
  - Principal Product Manager
  - Group Product Manager
  - Lead Product Manager
  - Director of Product AI
  - Director of Product Data

# ── Scoring thresholds ──────────────────────────────────────────────────────
# Roles below this score (1-10) are excluded from the digest.
min_score_threshold: 4

# Max jobs to score per run (cost guard). Pre-filter removes non-PM titles first.
max_score_per_run: 80

# How many roles to include in Part 1 of the digest.
top_roles_per_digest: 10

# How many outreach targets to include in Part 2.
top_outreach_per_digest: 10

# ── Models ──────────────────────────────────────────────────────────────────
# Scoring: sonnet is sufficient and cheaper (many calls per run).
scoring_model: claude-sonnet-4-6

# Outreach discovery: sonnet has web_search tool access.
outreach_model: claude-sonnet-4-6

# Legacy resume tailoring model (kept for backward compat).
anthropic_model: claude-opus-4-7

# ── Gmail scrape ────────────────────────────────────────────────────────────
gmail_lookback_days: 7

gmail_search_hints:
  - subject:(job OR role OR position OR opening OR opportunity)
  - from:(jobs OR careers OR talent OR recruiting OR noreply)
  - "\"product manager\""
  - "\"data product\""
  - "\"AI product\""
  - "\"applied AI\""
  - "\"data platform\""

# ── Legacy resume tailoring ─────────────────────────────────────────────────
max_tailored_per_run: 10
