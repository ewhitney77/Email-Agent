# Target companies.
#
# Handles below were identified from each company's public careers page.
# They are NOT live-API-verified — verify on first run by checking the agent
# logs for "ATS fetch failed for <company>" warnings, and update any bad
# entries here.
#
# How to find the handle:
#   Greenhouse: career page is boards.greenhouse.io/<handle>     -> use <handle>
#   Lever:      career page is jobs.lever.co/<handle>            -> use <handle>
#   Ashby:      career page is jobs.ashbyhq.com/<handle>         -> use <handle>
#   Workday:    career page is <tenant>.<host>.myworkdayjobs.com/<site>
#               -> set tenant, site, and host.
#
# Companies without a supported ATS (Google, Netflix, Snowflake on Phenom,
# Dynatrace on SuccessFactors, EnFI via email, Day.AI, Advisor360) are
# listed below as commented-out reminders. You'll need to monitor them via
# the Gmail scrape path (recruiter outreach, manual job-alert subscriptions)
# rather than ATS polling.

companies:
  - name: Anthropic
    ashby: anthropic

  - name: OpenAI
    ashby: openai

  - name: Databricks
    greenhouse: databricks

  - name: Datadog
    greenhouse: datadog

  - name: Snyk
    greenhouse: snyk

  - name: Jellyfish
    greenhouse: jellyfish

  - name: Lightmatter
    greenhouse: lightmatter

  - name: Maven AGI
    ashby: maven-agi

  - name: Zillow
    workday:
      tenant: zillow
      site: Zillow_Group_External
      host: wd5

  - name: Wasabi Tech
    greenhouse: wasabi

  - name: Immuta
    lever: immuta

  - name: Vizit
    greenhouse: vizit

  - name: Cribl
    greenhouse: cribl

  - name: Starburst
    greenhouse: starburst

  - name: Hubspot
    greenhouse: hubspotjobs

  - name: Monte Carlo Data
    ashby: montecarlodata

  - name: Sigma Computing
    greenhouse: sigmacomputing

  # --- No supported ATS (custom careers pages). The Gmail scrape will still
  # catch recruiter outreach and job alert emails from these companies as
  # long as the company name appears in the email body, subject, or sender.
  # - name: Google           # careers.google.com (custom)
  # - name: Netflix          # explore.jobs.netflix.net (custom)
